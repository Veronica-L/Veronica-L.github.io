<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>管理后台 · Kiki's Blog</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head>
<body>
  <header class="topbar"><a class="logo" href="/admin">Kiki's Blog<span>管理后台</span></a><nav><a id="visit-site" href="https://veronica-l.github.io/" target="_blank" rel="noopener">查看网站 ↗</a><button id="logout" hidden>退出登录</button></nav></header>
  <main>
    <section id="login-panel" class="login-panel"><span class="eyebrow">KIKI / ADMIN</span><h1>登录管理后台<span>.</span></h1><p>管理文章、日记和插图。</p><p class="muted">仅博客所有者可以登录。草稿只保存在后台，不会出现在公开网站。</p><a class="primary" id="login-link" href="/auth/login">使用 GitHub 登录 ↗</a><p id="login-status" role="status">正在检查登录状态…</p></section>
    <div id="workspace" class="workspace" hidden>
      <aside class="sidebar"><div class="section-label">CONTENT / 内容</div><button id="new-entry" class="primary">＋ 新建内容</button><label class="sr-only" for="entry-filter">筛选内容</label><select id="entry-filter"><option value="all">全部内容</option><option value="blog">博客文章</option><option value="diary">日记</option><option value="draft">未发布草稿</option></select><div id="entry-list" class="entry-list"></div><div class="side-note">草稿与插图保存在你的后台数据库中。点击「发布到网站」后才会公开。</div></aside>
      <section class="editor-area"><div class="editor-heading"><div><span class="eyebrow">EDITOR / 写作</span><h1 id="editor-heading">新建内容</h1></div><span id="record-state" class="badge">未保存</span></div>
        <form id="content-form"><div class="metadata"><label>类型<select id="type"><option value="blog">博客文章</option><option value="diary">日记</option></select></label><label>日期<input id="date" type="date" required></label><label id="category-label">分类<select id="category"><option>生活随笔</option><option>技术手记</option><option>旅行见闻</option></select></label></div>
          <label class="sr-only" for="title">标题</label><input id="title" class="title-input" placeholder="标题" maxlength="100" required>
          <div class="text-toolbar"><div class="tabs"><button id="write-tab" type="button" class="selected">编辑</button><button id="preview-tab" type="button">预览</button></div><button id="insert-image" type="button">＋ 插入图片</button><input id="image-input" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple hidden></div>
          <label class="sr-only" for="body">正文</label><textarea id="body" placeholder="输入正文，支持 Markdown 标题、列表和插图。" maxlength="50000" required></textarea><div id="preview" class="prose" hidden></div><div id="image-list" class="image-list"></div>
          <label class="tags-label" for="tags">标签<input id="tags" placeholder="用逗号分隔，如：日常, 摄影" maxlength="300"></label>
          <div class="editor-bottom"><span id="save-state" role="status">内容尚未保存。</span><div class="actions"><button id="download-draft" type="button">导出备份</button><button id="save-draft" type="submit">保存草稿</button><button id="publish" class="primary" type="button">发布到网站 ↗</button></div></div>
        </form>
        <section class="publication"><div><strong>发布状态</strong><p id="publish-status" role="status">尚未发布。保存草稿不会公开内容。</p></div><button id="unpublish" hidden>撤下公开版本</button></section><p class="footnote">发布内容会进入公开 GitHub 仓库。撤下内容不会清除仓库历史和已公开的图片。</p>
      </section>
    </div>
    <div id="notice" role="alert" hidden></div>
  </main>
</body></html>
